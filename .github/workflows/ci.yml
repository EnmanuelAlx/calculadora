name: CI Tests

on:
  push:
    branches:
      - '**'  # Se ejecuta en push a cualquier rama

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python   
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run tests
        run: python tests/test.py
