name: Tests

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.6.0"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -v

  test-echo:
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: echo "Hello World"

  test-echo2:
    runs-on: ubuntu-latest
    needs: [test, test-echo]
    steps:
      - name: Echo
        run: echo "Hello World"